<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idk34-Shop</title>
<style>
:root{--c:#111;--bordo:#e5e5e5;--sfondo:#f2f2f2}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;background:#fff;color:var(--c);line-height:1.3}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
main{max-width:960px;margin:0 auto;padding:0 18px 120px}

/* Header: pillola con il nome + cerchio del menu */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:14px max(18px,calc((100vw - 924px)/2));background:#fff}
.pill{flex:1;display:flex;align-items:center;justify-content:center;height:46px;
  border:1.5px solid var(--c);border-radius:999px;font-size:16px;font-weight:500;letter-spacing:1.5px}
.cerchio{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--c);background:#fff;
  color:var(--c);font-size:20px;line-height:1;cursor:pointer}
#menu{position:absolute;top:70px;right:max(18px,calc((100vw - 924px)/2));background:#fff;
  border:1.5px solid var(--c);border-radius:16px;padding:8px 32px;text-align:center;min-width:210px;
  box-shadow:0 8px 24px rgba(0,0,0,.12)}
#menu a{display:block;padding:14px 0;font-size:22px;text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:7px}

/* Home: collezioni = tre foto affiancate con etichetta */
.collezioni{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding-top:6px}
.coll{position:relative;display:block;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:var(--sfondo)}
.trittico{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:100%}
.trittico img{width:100%;height:100%;object-fit:cover;display:block}
.etichetta{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;
  align-items:baseline;padding:12px 18px;background:#fff;border:1.5px solid var(--c);border-radius:12px}
.etichetta b{font-size:22px;font-weight:800;letter-spacing:-.3px}
.etichetta span{font-size:16px;font-weight:200}
.fondo{display:block;text-align:center;margin-top:40px;padding:18px;border:1.5px solid var(--c);
  border-radius:12px;font-size:18px;transition:.2s}
.fondo:hover{background:var(--c);color:#fff}
footer{text-align:center;font-size:12px;margin-top:26px}

/* Titoli di pagina */
.titolo{font-size:38px;font-weight:800;letter-spacing:-.5px;margin:10px 0 18px}
.sottile{font-size:20px;font-weight:200;margin:-10px 0 20px}

/* Griglia di foto 4:5 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:4/5;background:var(--sfondo);border:2px solid transparent;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
#gridScegli .ph{cursor:pointer}
.ph.sel{border-color:var(--c)}
.ph.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;
  border-radius:50%;background:var(--c);color:#fff;text-align:center;line-height:24px;font-size:14px}

/* Pagina collezione: "Acquista" al centro dello schermo sopra le foto, prezzo sotto */
.vetro{position:relative}
.cta-box{position:sticky;top:calc(50vh - 26px);height:0;z-index:5;text-align:center}
.cta{display:inline-block;padding:14px 40px;font-size:17px;border:1.5px solid var(--c);border-radius:999px;
  background:rgba(255,255,255,.96);color:var(--c);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.cta:hover{background:var(--c);color:#fff}
.prezzoColl{text-align:center;font-size:42px;font-weight:200;margin:28px 0}

/* Barra carrello (solo in "Scegli") */
.bar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;
  padding:14px 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--bordo)}
.bar.show{display:flex}
.btn{padding:12px 30px;font-size:15px;border:1.5px solid var(--c);border-radius:999px;
  background:#fff;color:var(--c);cursor:pointer}
.btn:hover{background:var(--c);color:#fff}

.ok{max-width:560px;margin:20px auto 0;padding:22px;border:1.5px solid var(--c);border-radius:12px;text-align:center}
.ok a{display:block;margin:8px 0;text-decoration:underline}
</style>
</head>
<body>

<header>
  <a class="pill" id="nomeSito" href="#"></a>
  <button class="cerchio" id="menuBtn" aria-label="Menu">☰</button>
  <nav id="menu" hidden>
    <a href="#">Collezioni</a>
    <a href="#scegli">Scegli</a>
  </nav>
</header>

<main>
  <div id="grazie"></div>

  <!-- HOME: tutte le collezioni -->
  <section id="home">
    <div class="collezioni" id="collezioni"></div>
    <a class="fondo" href="#scegli">Scegli</a>
    <footer>Nessun dato viene registrato</footer>
  </section>

  <!-- PAGINA DI UNA COLLEZIONE -->
  <section id="vistaColl" hidden>
    <h1 class="titolo" id="titoloColl"></h1>
    <div class="vetro">
      <div class="cta-box"><button class="cta" id="bColl">Acquista</button></div>
      <div class="grid" id="gridColl"></div>
    </div>
    <div class="prezzoColl" id="prezzoColl"></div>
  </section>

  <!-- SCEGLI (tutte le foto) -->
  <section id="scegli" hidden>
    <h1 class="titolo">Scegli</h1>
    <p class="sottile" id="prezzoSingola"></p>
    <div class="grid" id="gridScegli"></div>
  </section>
</main>

<div class="bar" id="bar">
  <div><b id="n">0</b> · <b id="tot">0,00 €</b></div>
  <button class="btn" id="bPaga">Acquista</button>
</div>

<script>
/* ═══════ VALORI DA MODIFICARE ═══════ */
const API = "https://frosty-field-353f.ism-gbb.workers.dev";
const NOME_SITO = "IDK34 - SHOP";   // scritta nella pillola in alto
const BASE_FOTO = "foto";           // cartella delle foto nel repository
const LATO_MAX = 500;               // lato massimo (px) delle foto mostrate
const QUALITA = 0.35;               // qualità JPEG delle foto mostrate (0-1)
/* Collezioni, prezzi e foto si modificano in catalogo.json */
/* ═══════ FINE VALORI ═══════ */

const eur = x => x.toFixed(2).replace(".", ",") + " €";
const eurPulito = x => eur(x).replace(",00", "");
const src = nome => BASE_FOTO + "/" + nome;
const $ = id => document.getElementById(id);

$("nomeSito").textContent = NOME_SITO;
document.title = NOME_SITO;

let CAT, tutte, visibili;
const sel = new Set();
let sceltaPronta = false;

const inColl = nome => tutte.filter(n => CAT.foto[n] === nome);

/* Mostra la foto ridotta e a bassa qualità (disegnata su canvas) */
function caricaBassa(img){
  const o = new Image();
  o.crossOrigin = "anonymous";
  o.onload = () => {
    try{
      const k = Math.min(1, LATO_MAX / Math.max(o.naturalWidth, o.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(o.naturalWidth * k);
      c.height = Math.round(o.naturalHeight * k);
      c.getContext("2d").drawImage(o, 0, 0, c.width, c.height);
      img.src = c.toDataURL("image/jpeg", QUALITA);
    }catch(e){ console.error("Canvas bloccato:", e); }
  };
  o.onerror = () => console.error("Foto non trovata:", src(img.dataset.nome));
  o.src = src(img.dataset.nome);
}

/* Ogni foto si carica solo quando sta per entrare nello schermo */
const oss = new IntersectionObserver(voci => {
  voci.forEach(v => {
    if(v.isIntersecting){ oss.unobserve(v.target); caricaBassa(v.target); }
  });
}, {rootMargin: "300px"});

function foto(nome){
  const d = document.createElement("div");
  d.className = "ph";
  const im = document.createElement("img");
  im.dataset.nome = nome;
  im.alt = "";
  im.draggable = false;
  d.appendChild(im);
  d.oncontextmenu = e => e.preventDefault();
  oss.observe(im);
  return d;
}

/* ───── HOME ───── */
function disegnaHome(){
  const box = $("collezioni");
  box.innerHTML = "";
  visibili.forEach(nome => {
    const a = document.createElement("a");
    a.className = "coll";
    a.href = "#c/" + encodeURIComponent(nome);
    a.innerHTML = `<div class="trittico"></div>
      <div class="etichetta"><b></b><span>scarica</span></div>`;
    a.querySelector("b").textContent = nome;
    const tr = a.querySelector(".trittico");
    inColl(nome).slice(0, 3).forEach(n => {      // le prime 3 foto della collezione
      const im = document.createElement("img");
      im.dataset.nome = n;
      im.alt = "";
      tr.appendChild(im);
      oss.observe(im);
    });
    box.appendChild(a);
  });
}

/* ───── COLLEZIONE ───── */
function disegnaColl(nome){
  $("titoloColl").textContent = nome;
  const g = $("gridColl");
  g.innerHTML = "";
  inColl(nome).forEach(n => g.appendChild(foto(n)));
  $("prezzoColl").textContent = eurPulito(CAT.collezioni[nome]);
  $("bColl").onclick = () => checkout({collezione: nome});
}

/* ───── SCEGLI ───── */
function costruisciScegli(){
  const g = $("gridScegli");
  tutte.forEach(nome => {
    const d = foto(nome);
    d.onclick = () => {
      sel.has(nome) ? sel.delete(nome) : sel.add(nome);
      d.classList.toggle("sel");
      aggiorna();
    };
    g.appendChild(d);
  });
  sceltaPronta = true;
}

function aggiorna(){
  const inScelta = !$("scegli").hidden;
  $("n").textContent = sel.size;
  $("tot").textContent = eur(sel.size * CAT.prezzoSingola);
  $("bar").classList.toggle("show", inScelta && sel.size > 0);
}

/* ───── Navigazione (il tasto indietro del telefono funziona) ───── */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let v = "home", nome = null;
  if(h === "scegli") v = "scegli";
  else if(h.startsWith("c/") && visibili.includes(h.slice(2))){ v = "coll"; nome = h.slice(2); }

  $("home").hidden = v !== "home";
  $("vistaColl").hidden = v !== "coll";
  $("scegli").hidden = v !== "scegli";
  $("menu").hidden = true;

  if(v === "coll") disegnaColl(nome);
  if(v === "scegli" && !sceltaPronta) costruisciScegli();
  window.scrollTo(0, 0);
  aggiorna();
}

/* Menu (cerchio in alto a destra) */
$("menuBtn").onclick = e => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
document.addEventListener("click", () => { $("menu").hidden = true; });

/* ───── Pagamento ───── */
async function checkout(body){
  try{
    const r = await fetch(API + "/checkout", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.url) location.href = j.url; else alert("Errore: " + (j.error || "riprova"));
  }catch(e){ alert("Errore di connessione"); }
}
$("bPaga").onclick = () => checkout({ids: [...sel]});

/* Dopo il pagamento Stripe riporta qui con ?session_id=... */
(async () => {
  const sid = new URLSearchParams(location.search).get("session_id");
  if(!sid) return;
  const box = $("grazie");
  try{
    const r = await fetch(API + "/downloads?session_id=" + encodeURIComponent(sid));
    const j = await r.json();
    if(!j.files) throw 0;
    box.innerHTML = `<div class="ok">` +
      j.files.map(f => `<a href="${f.url}" download>⬇ ${f.name}</a>`).join("") + `</div>`;
  }catch(e){
    box.innerHTML = `<div class="ok">Ricarica tra qualche secondo</div>`;
  }
})();

/* ───── Avvio: carica il catalogo ───── */
fetch("catalogo.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(c => {
    CAT = c;
    tutte = Object.keys(CAT.foto);
    visibili = Object.keys(CAT.collezioni).filter(n => inColl(n).length > 0);
    $("prezzoSingola").textContent = eur(CAT.prezzoSingola);
    disegnaHome();
    addEventListener("hashchange", route);
    route();
  })
  .catch(() => { $("home").innerHTML = "<p>Errore nel caricamento di catalogo.json</p>"; });
</script>
</body>
</html>
