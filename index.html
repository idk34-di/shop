<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idk34-Shop</title>
<style>
:root{--c:#3aa0d8;--c2:#8fcdf0;--bordo:#e6f3fb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#fff;color:var(--c);line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:0 16px 120px}

/* Ventaglio */
.hero{text-align:center;padding:70px 0 44px}
.ventaglio{position:relative;height:190px;max-width:420px;margin:0 auto 34px}
.carta{position:absolute;left:50%;bottom:0;width:170px;height:120px;margin-left:-85px;
  overflow:hidden;border-radius:10px;border:3px solid #fff;background:#f3f9fd;
  box-shadow:0 6px 18px rgba(58,160,216,.25);transform-origin:50% 330%}
.carta img{width:100%;height:240px;object-fit:cover;object-position:top;display:block}
.carta:nth-child(1){transform:rotate(-17deg);z-index:1}
.carta:nth-child(2){transform:rotate(0);z-index:3}
.carta:nth-child(3){transform:rotate(17deg);z-index:2}
.hero h1{font-size:28px;font-weight:400;letter-spacing:2px}
.prezzo{font-size:44px;font-weight:300;margin:4px 0 18px}
.btn{padding:13px 34px;font-size:15px;border:1px solid var(--c);border-radius:999px;
  background:#fff;color:var(--c);cursor:pointer;transition:.2s}
.btn:hover{background:var(--c);color:#fff}

/* Scegli manualmente (chiuso finché non lo premi) */
.toggle{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;
  padding:22px 0;border:0;border-top:1px solid var(--bordo);background:none;
  color:var(--c);font-size:18px;cursor:pointer}
.toggle small{color:var(--c2);font-size:14px}
.toggle .fr{display:inline-block;transition:transform .25s}
.toggle.open .fr{transform:rotate(180deg)}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-top:10px}
.grid.open{display:grid}
.ph{position:relative;cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#f3f9fd;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
.ph.sel{border-color:var(--c)}
.ph.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;
  border-radius:50%;background:var(--c);color:#fff;text-align:center;line-height:24px;font-size:14px}

/* Barra carrello */
.bar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;
  padding:14px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--bordo)}
.bar.show{display:flex}

.ok{max-width:560px;margin:36px auto 0;padding:22px;border:1px solid var(--bordo);border-radius:12px;text-align:center}
.ok a{display:block;color:var(--c);margin:8px 0}
footer{text-align:center;color:var(--c2);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<main>
  <div id="grazie"></div>

  <section class="hero">
    <div class="ventaglio" id="ventaglio"></div>
    <h1>Cagliari</h1>
    <div class="prezzo" id="prezzoPack"></div>
    <button class="btn" id="bPack">Acquista</button>
  </section>

  <button class="toggle" id="toggle">
    Scegli manualmente <small id="prezzoSingola"></small> <span class="fr">⌄</span>
  </button>
  <div class="grid" id="grid"></div>

  <footer>Nessun dato viene registrato</footer>
</main>

<div class="bar" id="bar">
  <div><b id="n">0</b> · <b id="tot">0,00 €</b></div>
  <button class="btn" id="bPaga">Paga</button>
</div>

<script>
/* ═══════ VALORI DA MODIFICARE ═══════ */
const API = "https://TUO-WORKER.TUOACCOUNT.workers.dev";
const CARTELLA = "foto";        // cartella del repository con tutte le foto
const PREZZO_PACK = 10;         // euro
const PREZZO_SINGOLA = 0.99;    // euro
const LATO_MAX = 500;           // lato massimo (px) delle foto mostrate sul sito
const QUALITA = 0.35;           // qualità JPEG delle foto mostrate (0-1)

/* Le 12 foto del pacchetto (le prime 3 finiscono nel ventaglio) */
const PACCHETTO = [
  "IMG_7305.jpg","IMG_7307.jpg","IMG_7313.JPG","IMG_7316.jpg",
  "IMG_7585.jpg","IMG_7588.JPG","IMG_7597.jpg","IMG_7603.JPG",
  "IMG_7606.JPG","IMG_7610.jpg","IMG_7767.jpg","IMG_7782.jpg"
];

/* Tutte le foto vendibili singolarmente (nomi esatti, maiuscole incluse) */
const TUTTE = [
  "IMG_7299.jpg","IMG_7301.jpg","IMG_7302.jpg","IMG_7305.jpg","IMG_7307.jpg","IMG_7309.JPG","IMG_7310.jpg","IMG_7313.JPG","IMG_7316.jpg",
  "IMG_7585.jpg","IMG_7588.JPG","IMG_7589.jpg","IMG_7592.jpg","IMG_7594.JPG","IMG_7595.jpg","IMG_7597.jpg","IMG_7602.jpg","IMG_7603.JPG",
  "IMG_7604.jpg","IMG_7606.JPG","IMG_7608.jpg","IMG_7609.JPG","IMG_7610.jpg","IMG_7611.JPG","IMG_7613.JPG","IMG_7615.jpg","IMG_7618.jpg",
  "IMG_7620.jpg","IMG_7621.jpg","IMG_7690.jpg","IMG_7762.jpg","IMG_7764.jpg","IMG_7765.jpg","IMG_7766.jpg","IMG_7767.jpg","IMG_7768.jpg",
  "IMG_7769.jpg","IMG_7771.jpg","IMG_7772.jpg","IMG_7773.jpg","IMG_7775.jpg","IMG_7776.jpg","IMG_7777.jpg","IMG_7779.jpg","IMG_7780.JPG",
  "IMG_7782.jpg","IMG_7783.jpg","IMG_7785.jpg","IMG_7788.jpg","IMG_7790.jpg","IMG_7791.jpg","IMG_7792.jpg","IMG_7793.jpg","IMG_7794.jpg",
  "IMG_7795.jpg","IMG_7796.jpg","IMG_7797.jpg",
  "DSC_0338.JPG","DSC_0345.JPG","DSC_0360.JPG","DSC_0364.JPG","DSC_0366.JPG","DSC_0379.JPG","DSC_0384.JPG","DSC_0391.JPG","DSC_0393.JPG",
  "DSC_0394.JPG","DSC_0399.JPG","DSC_0406.JPG","DSC_0407.JPG","DSC_0410.JPG","DSC_0412.JPG","DSC_0433.JPG","DSC_0437.JPG","DSC_0441.JPG",
  "DSC_0442.JPG","DSC_0443.JPG","DSC_0448.JPG"
];
/* ═══════ FINE VALORI ═══════ */

const eur = x => x.toFixed(2).replace(".", ",") + " €";
const src = nome => CARTELLA + "/" + nome;

/* Carica la foto e la mostra ridotta e a bassa qualità (disegnata su canvas) */
function caricaBassa(img){
  const o = new Image();
  o.onload = () => {
    const k = Math.min(1, LATO_MAX / Math.max(o.naturalWidth, o.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(o.naturalWidth * k);
    c.height = Math.round(o.naturalHeight * k);
    c.getContext("2d").drawImage(o, 0, 0, c.width, c.height);
    img.src = c.toDataURL("image/jpeg", QUALITA);
  };
  o.src = src(img.dataset.nome);
}

document.getElementById("prezzoPack").textContent = eur(PREZZO_PACK).replace(",00", "");
document.getElementById("prezzoSingola").textContent = eur(PREZZO_SINGOLA);

/* Ventaglio: 3 foto tagliate a metà */
const vent = document.getElementById("ventaglio");
PACCHETTO.slice(0, 3).forEach(n => {
  const d = document.createElement("div");
  d.className = "carta";
  const im = document.createElement("img");
  im.dataset.nome = n;
  im.alt = "";
  d.appendChild(im);
  vent.appendChild(d);
  caricaBassa(im);
});

/* Griglia: si costruisce solo quando premi "Scegli manualmente",
   e ogni foto viene caricata solo quando sta per entrare nello schermo */
const sel = new Set();
const grid = document.getElementById("grid");
const toggle = document.getElementById("toggle");
let costruita = false;

function costruisciGriglia(){
  const osserva = new IntersectionObserver(voci => {
    voci.forEach(v => {
      if(v.isIntersecting){
        osserva.unobserve(v.target);
        caricaBassa(v.target.querySelector("img"));
      }
    });
  }, {rootMargin: "300px"});

  TUTTE.forEach(nome => {
    const d = document.createElement("div");
    d.className = "ph";
    d.innerHTML = `<img data-nome="${nome}" alt="" draggable="false">`;
    d.oncontextmenu = e => e.preventDefault();
    d.onclick = () => {
      sel.has(nome) ? sel.delete(nome) : sel.add(nome);
      d.classList.toggle("sel");
      aggiorna();
    };
    grid.appendChild(d);
    osserva.observe(d);
  });
  costruita = true;
}

toggle.onclick = () => {
  if(!costruita) costruisciGriglia();
  const aperta = grid.classList.toggle("open");
  toggle.classList.toggle("open", aperta);
};

function aggiorna(){
  document.getElementById("n").textContent = sel.size;
  document.getElementById("tot").textContent = eur(sel.size * PREZZO_SINGOLA);
  document.getElementById("bar").classList.toggle("show", sel.size > 0);
}

/* Pagamento */
async function checkout(body){
  try{
    const r = await fetch(API + "/checkout", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.url) location.href = j.url; else alert("Errore: " + (j.error || "riprova"));
  }catch(e){ alert("Errore di connessione"); }
}
document.getElementById("bPack").onclick = () => checkout({pack: true});
document.getElementById("bPaga").onclick = () => checkout({ids: [...sel]});

/* Dopo il pagamento Stripe riporta qui con ?session_id=... */
(async () => {
  const sid = new URLSearchParams(location.search).get("session_id");
  if(!sid) return;
  const box = document.getElementById("grazie");
  try{
    const r = await fetch(API + "/downloads?session_id=" + encodeURIComponent(sid));
    const j = await r.json();
    if(!j.files) throw 0;
    box.innerHTML = `<div class="ok">` +
      j.files.map(f => `<a href="${f.url}" download>⬇ ${f.name}</a>`).join("") + `</div>`;
  }catch(e){
    box.innerHTML = `<div class="ok">Ricarica tra qualche secondo</div>`;
  }
})();
</script>
</body>
</html>
