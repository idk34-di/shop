<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idk34-shop</title>
<style>
:root{--c:#3aa0d8;--c2:#8fcdf0;--bordo:#e6f3fb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;background:#fff;color:var(--c);line-height:1.3}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
main{max-width:960px;margin:0 auto;padding:0 18px 120px}

/* Header: indietro a sinistra, menu a destra */
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;background:#fff}
header a,header button{font-size:28px;line-height:1;background:none;border:0;color:var(--c);cursor:pointer;padding:4px 6px}
#indietro{visibility:hidden}
#indietro.on{visibility:visible}
#menu{position:absolute;right:12px;top:54px;background:#fff;border:1px solid var(--bordo);
  border-radius:12px;box-shadow:0 8px 24px rgba(58,160,216,.18);padding:6px 0;min-width:220px}
#menu a{display:block;padding:13px 20px;font-size:16px;font-weight:400}
#menu a:hover{background:#f3f9fd}

/* Home: collezioni una sotto l'altra, foto 4:5 */
.collezioni{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:52px 28px;padding-top:10px}
.coll{display:block}
.coll .img{aspect-ratio:4/5;background:#f3f9fd;overflow:hidden;border-radius:4px}
.coll img{width:100%;height:100%;object-fit:cover;display:block}
.coll h2{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:14px}
.coll p{font-size:20px;font-weight:200;margin-top:2px}
.fondo{display:block;text-align:center;margin-top:70px;padding:24px 0;border-top:1px solid var(--bordo);font-size:18px}
footer{text-align:center;color:var(--c2);font-size:12px;margin-top:30px}

/* Titoli di pagina */
.titolo{font-size:38px;font-weight:800;letter-spacing:-.5px;margin:10px 0 18px}
.sottile{font-size:20px;font-weight:200;margin:-10px 0 20px}

/* Griglia di foto 4:5 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:4/5;background:#f3f9fd;border:2px solid transparent;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
#gridScegli .ph{cursor:pointer}
.ph.sel{border-color:var(--c)}
.ph.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;
  border-radius:50%;background:var(--c);color:#fff;text-align:center;line-height:24px;font-size:14px}

/* Pagina collezione: "Acquista" al centro dello schermo sopra le foto, prezzo sotto */
.vetro{position:relative}
.cta-box{position:sticky;top:calc(50vh - 26px);height:0;z-index:5;text-align:center}
.cta{display:inline-block;padding:14px 40px;font-size:17px;border:1px solid var(--c);border-radius:999px;
  background:rgba(255,255,255,.95);color:var(--c);cursor:pointer;box-shadow:0 6px 20px rgba(58,160,216,.3)}
.cta:hover{background:var(--c);color:#fff}
.prezzoColl{text-align:center;font-size:42px;font-weight:200;margin:28px 0}

/* Barra carrello (solo in "Scegli quali scaricare") */
.bar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;
  padding:14px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--bordo)}
.bar.show{display:flex}
.btn{padding:12px 30px;font-size:15px;border:1px solid var(--c);border-radius:999px;
  background:#fff;color:var(--c);cursor:pointer}
.btn:hover{background:var(--c);color:#fff}

.ok{max-width:560px;margin:20px auto 0;padding:22px;border:1px solid var(--bordo);border-radius:12px;text-align:center}
.ok a{display:block;margin:8px 0}
</style>
</head>
<body>

<header>
  <a id="indietro" href="#" aria-label="Indietro">←</a>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <nav id="menu" hidden>
    <a href="#">Collezioni</a>
    <a href="#scegli">Scegli quali scaricare</a>
  </nav>
</header>

<main>
  <div id="grazie"></div>

  <!-- HOME: tutte le collezioni -->
  <section id="home">
    <div class="collezioni" id="collezioni"></div>
    <a class="fondo" href="#scegli">Scegli quali scaricare</a>
    <footer>Nessun dato viene registrato</footer>
  </section>

  <!-- PAGINA DI UNA COLLEZIONE -->
  <section id="vistaColl" hidden>
    <h1 class="titolo" id="titoloColl"></h1>
    <div class="vetro">
      <div class="cta-box"><button class="cta" id="bColl">Acquista</button></div>
      <div class="grid" id="gridColl"></div>
    </div>
    <div class="prezzoColl" id="prezzoColl"></div>
  </section>

  <!-- SCEGLI QUALI SCARICARE (tutte le foto) -->
  <section id="scegli" hidden>
    <h1 class="titolo">Scegli quali scaricare</h1>
    <p class="sottile" id="prezzoSingola"></p>
    <div class="grid" id="gridScegli"></div>
  </section>
</main>

<div class="bar" id="bar">
  <div><b id="n">0</b> · <b id="tot">0,00 €</b></div>
  <button class="btn" id="bPaga">Acquista</button>
</div>

<script>
/* ═══════ VALORI DA MODIFICARE ═══════ */
const API = "https://TUO-WORKER.TUOACCOUNT.workers.dev";
const BASE_FOTO = "foto";   // cartella delle foto nel repository
const LATO_MAX = 500;       // lato massimo (px) delle foto mostrate
const QUALITA = 0.35;       // qualità JPEG delle foto mostrate (0-1)
/* Collezioni, prezzi e foto si modificano in catalogo.json */
/* ═══════ FINE VALORI ═══════ */

const eur = x => x.toFixed(2).replace(".", ",") + " €";
const eurPulito = x => eur(x).replace(",00", "");
const src = nome => BASE_FOTO + "/" + nome;
const $ = id => document.getElementById(id);

let CAT, tutte, visibili;
const sel = new Set();
let sceltaPronta = false;

const inColl = nome => tutte.filter(n => CAT.foto[n] === nome);

/* Mostra la foto ridotta e a bassa qualità (disegnata su canvas) */
function caricaBassa(img){
  const o = new Image();
  o.crossOrigin = "anonymous";
  o.onload = () => {
    try{
      const k = Math.min(1, LATO_MAX / Math.max(o.naturalWidth, o.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(o.naturalWidth * k);
      c.height = Math.round(o.naturalHeight * k);
      c.getContext("2d").drawImage(o, 0, 0, c.width, c.height);
      img.src = c.toDataURL("image/jpeg", QUALITA);
    }catch(e){ console.error("Canvas bloccato:", e); }
  };
  o.onerror = () => console.error("Foto non trovata:", src(img.dataset.nome));
  o.src = src(img.dataset.nome);
}

/* Ogni foto si carica solo quando sta per entrare nello schermo */
const oss = new IntersectionObserver(voci => {
  voci.forEach(v => {
    if(v.isIntersecting){ oss.unobserve(v.target); caricaBassa(v.target); }
  });
}, {rootMargin: "300px"});

function foto(nome){
  const d = document.createElement("div");
  d.className = "ph";
  const im = document.createElement("img");
  im.dataset.nome = nome;
  im.alt = "";
  im.draggable = false;
  d.appendChild(im);
  d.oncontextmenu = e => e.preventDefault();
  oss.observe(im);
  return d;
}

/* ───── HOME ───── */
function disegnaHome(){
  const box = $("collezioni");
  box.innerHTML = "";
  visibili.forEach(nome => {
    const a = document.createElement("a");
    a.className = "coll";
    a.href = "#c/" + encodeURIComponent(nome);
    a.innerHTML = `<div class="img"><img alt=""></div><h2></h2><p>scarica</p>`;
    a.querySelector("h2").textContent = nome;
    const im = a.querySelector("img");
    im.dataset.nome = inColl(nome)[0];   // copertina = prima foto della collezione
    oss.observe(im);
    box.appendChild(a);
  });
}

/* ───── COLLEZIONE ───── */
function disegnaColl(nome){
  $("titoloColl").textContent = nome;
  const g = $("gridColl");
  g.innerHTML = "";
  inColl(nome).forEach(n => g.appendChild(foto(n)));
  $("prezzoColl").textContent = eurPulito(CAT.collezioni[nome]);
  $("bColl").onclick = () => checkout({collezione: nome});
}

/* ───── SCEGLI QUALI SCARICARE ───── */
function costruisciScegli(){
  const g = $("gridScegli");
  tutte.forEach(nome => {
    const d = foto(nome);
    d.onclick = () => {
      sel.has(nome) ? sel.delete(nome) : sel.add(nome);
      d.classList.toggle("sel");
      aggiorna();
    };
    g.appendChild(d);
  });
  sceltaPronta = true;
}

function aggiorna(){
  const inScelta = !$("scegli").hidden;
  $("n").textContent = sel.size;
  $("tot").textContent = eur(sel.size * CAT.prezzoSingola);
  $("bar").classList.toggle("show", inScelta && sel.size > 0);
}

/* ───── Navigazione (il tasto indietro del telefono funziona) ───── */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let v = "home", nome = null;
  if(h === "scegli") v = "scegli";
  else if(h.startsWith("c/") && visibili.includes(h.slice(2))){ v = "coll"; nome = h.slice(2); }

  $("home").hidden = v !== "home";
  $("vistaColl").hidden = v !== "coll";
  $("scegli").hidden = v !== "scegli";
  $("indietro").classList.toggle("on", v !== "home");
  $("menu").hidden = true;

  if(v === "coll") disegnaColl(nome);
  if(v === "scegli" && !sceltaPronta) costruisciScegli();
  window.scrollTo(0, 0);
  aggiorna();
}

/* Menu in alto a destra */
$("menuBtn").onclick = e => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
document.addEventListener("click", () => { $("menu").hidden = true; });

/* ───── Pagamento ───── */
async function checkout(body){
  try{
    const r = await fetch(API + "/checkout", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.url) location.href = j.url; else alert("Errore: " + (j.error || "riprova"));
  }catch(e){ alert("Errore di connessione"); }
}
$("bPaga").onclick = () => checkout({ids: [...sel]});

/* Dopo il pagamento Stripe riporta qui con ?session_id=... */
(async () => {
  const sid = new URLSearchParams(location.search).get("session_id");
  if(!sid) return;
  const box = $("grazie");
  try{
    const r = await fetch(API + "/downloads?session_id=" + encodeURIComponent(sid));
    const j = await r.json();
    if(!j.files) throw 0;
    box.innerHTML = `<div class="ok">` +
      j.files.map(f => `<a href="${f.url}" download>⬇ ${f.name}</a>`).join("") + `</div>`;
  }catch(e){
    box.innerHTML = `<div class="ok">Ricarica tra qualche secondo</div>`;
  }
})();

/* ───── Avvio: carica il catalogo ───── */
fetch("catalogo.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(c => {
    CAT = c;
    tutte = Object.keys(CAT.foto);
    visibili = Object.keys(CAT.collezioni).filter(n => inColl(n).length > 0);
    $("prezzoSingola").textContent = eur(CAT.prezzoSingola);
    disegnaHome();
    addEventListener("hashchange", route);
    route();
  })
  .catch(() => { $("home").innerHTML = "<p>Errore nel caricamento di catalogo.json</p>"; });
</script>
</body>
</html>
